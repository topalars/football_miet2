services:
  web:
    build: ./web_service
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-dev-only-insecure-key-do-not-use-in-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-1}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    depends_on:
      - comments
      - notification
    networks:
      - football_network

  comments:
    build: ./comments_service
    expose:
      - "8001"
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
    networks:
      - football_network

  notification:
    build: ./notification_service
    expose:
      - "8002"
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    networks:
      - football_network

networks:
  football_network:
    driver: bridge
